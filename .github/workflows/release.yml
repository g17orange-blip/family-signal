name: release

# Builds release artifacts on every v* tag (and on manual dispatch):
#   - signaling-linux-amd64 / -arm64   (static Go binaries; consumed by server/install.sh)
#   - signal-setup.exe                  (Windows client installer; no secrets baked in)
# On a tag push the artifacts are attached to a GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GST_VERSION: "1.26.11"
  QT_VERSION: "6.7.3"

jobs:
  # ---------------------------------------------------------------- signaling
  signaling:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/signaling/go.sum
      - name: Build static binary
        working-directory: server/signaling
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w" -o "signaling-linux-${GOARCH}" .
      - uses: actions/upload-artifact@v4
        with:
          name: signaling-linux-${{ matrix.goarch }}
          path: server/signaling/signaling-linux-${{ matrix.goarch }}

  # -------------------------------------------------------- windows installer
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: qtwebsockets
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install pkg-config
        run: choco install --no-progress pkgconfiglite

      - name: Install GStreamer (runtime + devel)
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          foreach ($pkg in @("gstreamer-1.0-msvc-x86_64", "gstreamer-1.0-devel-msvc-x86_64")) {
            $msi = "$env:RUNNER_TEMP\$pkg.msi"
            Invoke-WebRequest "$base/$pkg-$env:GST_VERSION.msi" -OutFile $msi
            Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /qn ADDLOCAL=ALL"
          }
          # The MSI registers its install root as a machine env var; don't assume C:\gstreamer.
          $root = [Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine')
          if (-not $root) {
            $root = @("C:\gstreamer\1.0\msvc_x86_64", "$env:ProgramFiles\gstreamer\1.0\msvc_x86_64") |
              Where-Object { Test-Path "$_\lib\pkgconfig\gstreamer-1.0.pc" } | Select-Object -First 1
          }
          $root = "$root".TrimEnd('\')
          Write-Host "GStreamer root: $root"
          if (-not $root -or -not (Test-Path "$root\lib\pkgconfig\gstreamer-1.0.pc")) {
            Write-Host "gstreamer-1.0.pc not found under '$root' — dumping installed layout for diagnosis:"
            Get-ChildItem -Path "C:\gstreamer", "$env:ProgramFiles\gstreamer" -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 80
            throw "GStreamer devel files missing after MSI install"
          }
          "GSTREAMER_ROOT=$root"                  | Out-File $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$root\lib\pkgconfig"   | Out-File $env:GITHUB_ENV -Append
          "$root\bin"                             | Out-File $env:GITHUB_PATH -Append

      - name: Configure & build
        shell: pwsh
        run: |
          cmake -B build -S client -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Stage runtime (windeployqt + GStreamer)
        shell: pwsh
        run: |
          $dist = "build\dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build\signal-client.exe $dist
          windeployqt --release --no-translations "$dist\signal-client.exe"
          # Core GStreamer runtime DLLs + the plugins webrtcbin/media path needs.
          Copy-Item "$env:GSTREAMER_ROOT\bin\*.dll" $dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$dist\gstreamer-1.0" | Out-Null
          Copy-Item "$env:GSTREAMER_ROOT\lib\gstreamer-1.0\*.dll" "$dist\gstreamer-1.0" -ErrorAction SilentlyContinue

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install --no-progress innosetup
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppSrc=$(Resolve-Path build\dist)" client\packaging\signal.iss
          # ISCC writes the installer to client\packaging\Output\signal-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: signal-setup
          path: client/packaging/Output/signal-setup.exe

  # ------------------------------------------------------------- macOS .dmg
  macos-dmg:
    strategy:
      matrix:
        include:
          - { runner: macos-15-intel, arch: x86_64 }  # Intel
          - { runner: macos-14, arch: arm64 }          # Apple Silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake qt gstreamer dylibbundler
      - name: Build .dmg
        run: bash client/packaging/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: signal-macos-${{ matrix.arch }}
          path: build/signal-macos-${{ matrix.arch }}.dmg

  # -------------------------------------------------------- Linux AppImage
  linux-appimage:
    runs-on: ubuntu-22.04   # older base for broad glibc compatibility
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 22.04's apt Qt is 6.2, below our 6.5 minimum — use the official
      # Qt build (same as the Windows job); apt provides GStreamer and tools.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # Preinstalled libunwind-14-dev (LLVM) conflicts with libunwind-dev,
          # which libgstreamer1.0-dev depends on — a known ubuntu-22.04 runner quirk.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file fuse libfuse2 \
            libxcb-cursor0 libxkbcommon-x11-0 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-nice gstreamer1.0-libav gstreamer1.0-x
      - name: Build AppImage
        run: |
          export CMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # linuxdeploy-plugin-qt chokes on exotic Qt SQL drivers whose system
          # libs aren't installed (Mimer needs libmimerapi.so, etc.). We only
          # use the bundled sqlite driver — drop the rest before deploying.
          find "$QT_ROOT_DIR/plugins/sqldrivers" -name 'libqsql*.so' ! -name 'libqsqlite.so' -print -delete
          bash client/packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: signal-linux-appimage
          path: signal-x86_64.AppImage

  # ---------------------------------------------------------------- release
  release:
    needs: [signaling, windows-installer, macos-dmg, linux-appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/signaling-linux-amd64/signaling-linux-amd64
            artifacts/signaling-linux-arm64/signaling-linux-arm64
            artifacts/signal-setup/signal-setup.exe
            artifacts/signal-macos-x86_64/signal-macos-x86_64.dmg
            artifacts/signal-macos-arm64/signal-macos-arm64.dmg
            artifacts/signal-linux-appimage/signal-x86_64.AppImage
