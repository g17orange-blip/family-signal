name: release

# Builds release artifacts on every v* tag (and on manual dispatch):
#   - signaling-linux-amd64 / -arm64   (static Go binaries; consumed by server/install.sh)
#   - signal-setup.exe                  (Windows client installer; no secrets baked in)
# On a tag push the artifacts are attached to a GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Which artifact to build (manual runs only)"
        type: choice
        default: all
        options:
          - all
          - signaling
          - windows
          - macos          # both arches
          - macos-arm64     # Apple Silicon only
          - macos-x86_64    # Intel only
          - linux

permissions:
  contents: write

env:
  GST_VERSION: "1.26.11"
  QT_VERSION: "6.7.3"

jobs:
  # Resolves what to build. Tag pushes always build everything; a manual
  # run honours the `target` choice. Every build job gates on these outputs,
  # and macos-dmg takes its matrix from here so a single arch can be picked.
  plan:
    runs-on: ubuntu-latest
    outputs:
      signaling: ${{ steps.f.outputs.signaling }}
      windows:   ${{ steps.f.outputs.windows }}
      linux:     ${{ steps.f.outputs.linux }}
      macos_any: ${{ steps.f.outputs.macos_any }}
      macos_matrix: ${{ steps.f.outputs.macos_matrix }}
      publish:   ${{ steps.f.outputs.publish }}
    steps:
      - id: f
        shell: bash
        env:
          # Empty for tag pushes → treated as "all".
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
        run: |
          want() { [ "$TARGET" = all ] || [ "$TARGET" = "$1" ]; }
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          out signaling "$(want signaling && echo true || echo false)"
          out windows   "$(want windows   && echo true || echo false)"
          out linux     "$(want linux     && echo true || echo false)"

          legs=()
          case "$TARGET" in
            all|macos|macos-arm64)  legs+=('{"runner":"macos-14","arch":"arm64"}') ;;
          esac
          case "$TARGET" in
            all|macos|macos-x86_64) legs+=('{"runner":"macos-15-intel","arch":"x86_64"}') ;;
          esac
          if [ ${#legs[@]} -gt 0 ]; then
            out macos_any true
          else
            out macos_any false
            # A skipped job (if=false) still parses its matrix; give it one
            # valid placeholder leg so an empty include never errors. It is
            # never executed because macos_any is false.
            legs+=('{"runner":"macos-14","arch":"arm64"}')
          fi
          IFS=,
          out macos_matrix "{\"include\":[${legs[*]}]}"

          # Publish a GitHub Release only on tag pushes (never on manual,
          # possibly-partial builds).
          [ "${{ github.ref_type }}" = tag ] && out publish true || out publish false
  # ---------------------------------------------------------------- signaling
  signaling:
    needs: plan
    if: needs.plan.outputs.signaling == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/signaling/go.sum
      - name: Build static binary
        working-directory: server/signaling
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w" -o "signaling-linux-${GOARCH}" .
      - uses: actions/upload-artifact@v4
        with:
          name: signaling-linux-${{ matrix.goarch }}
          path: server/signaling/signaling-linux-${{ matrix.goarch }}

  # -------------------------------------------------------- windows installer
  windows-installer:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: qtwebsockets
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install pkg-config
        run: choco install --no-progress pkgconfiglite

      - name: Install GStreamer (runtime + devel)
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          foreach ($pkg in @("gstreamer-1.0-msvc-x86_64", "gstreamer-1.0-devel-msvc-x86_64")) {
            $msi = "$env:RUNNER_TEMP\$pkg.msi"
            Invoke-WebRequest "$base/$pkg-$env:GST_VERSION.msi" -OutFile $msi
            Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /qn ADDLOCAL=ALL"
          }
          # The MSI registers its install root as a machine env var; don't assume C:\gstreamer.
          $root = [Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine')
          if (-not $root) {
            $root = @("C:\gstreamer\1.0\msvc_x86_64", "$env:ProgramFiles\gstreamer\1.0\msvc_x86_64") |
              Where-Object { Test-Path "$_\lib\pkgconfig\gstreamer-1.0.pc" } | Select-Object -First 1
          }
          $root = "$root".TrimEnd('\')
          Write-Host "GStreamer root: $root"
          if (-not $root -or -not (Test-Path "$root\lib\pkgconfig\gstreamer-1.0.pc")) {
            Write-Host "gstreamer-1.0.pc not found under '$root' — dumping installed layout for diagnosis:"
            Get-ChildItem -Path "C:\gstreamer", "$env:ProgramFiles\gstreamer" -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 80
            throw "GStreamer devel files missing after MSI install"
          }
          "GSTREAMER_ROOT=$root"                  | Out-File $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$root\lib\pkgconfig"   | Out-File $env:GITHUB_ENV -Append
          "$root\bin"                             | Out-File $env:GITHUB_PATH -Append

      - name: Configure & build
        shell: pwsh
        run: |
          cmake -B build -S client -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Stage runtime (windeployqt + GStreamer)
        shell: pwsh
        run: |
          $dist = "build\dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build\signal-client.exe $dist
          # --compiler-runtime ships vcruntime140/msvcp140 etc. next to the
          # exe — a fresh Windows install has no VC++ redistributable.
          windeployqt --release --no-translations --compiler-runtime "$dist\signal-client.exe"
          if (-not (Test-Path "$dist\vcruntime140.dll")) {
            Write-Host "windeployqt didn't copy the VC runtime — copying from the MSVC redist dir"
            $redist = Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT" -Directory | Select-Object -First 1
            Copy-Item "$($redist.FullName)\*.dll" $dist
          }
          # Core GStreamer runtime DLLs + the plugins webrtcbin/media path needs.
          Copy-Item "$env:GSTREAMER_ROOT\bin\*.dll" $dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$dist\gstreamer-1.0" | Out-Null
          Copy-Item "$env:GSTREAMER_ROOT\lib\gstreamer-1.0\*.dll" "$dist\gstreamer-1.0" -ErrorAction SilentlyContinue
          # The out-of-process plugin scanner: without it GStreamer scans
          # in-process ("Couldn't create helper process" in the logs) and a
          # crashing plugin would take the whole app down during the scan.
          Copy-Item "$env:GSTREAMER_ROOT\libexec\gstreamer-1.0\gst-plugin-scanner.exe" $dist -ErrorAction SilentlyContinue

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install --no-progress innosetup
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppSrc=$(Resolve-Path build\dist)" client\packaging\signal.iss
          # ISCC writes the installer to client\packaging\Output\signal-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: signal-setup
          path: client/packaging/Output/signal-setup.exe

  # ------------------------------------------------------------- macOS .dmg
  macos-dmg:
    needs: plan
    if: needs.plan.outputs.macos_any == 'true'
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # libnice-gstreamer: the `nice` GStreamer plugin (ICE transport) is a
        # separate formula — without it webrtcbin has no nicesrc/nicesink and
        # calls fail with "missing plugin" (broke the v0.3.0 dmg).
        run: brew install cmake qt gstreamer libnice-gstreamer dylibbundler
      - name: Build .dmg
        run: bash client/packaging/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: signal-macos-${{ matrix.arch }}
          path: build/signal-macos-${{ matrix.arch }}.dmg

  # -------------------------------------------------------- Linux AppImage
  linux-appimage:
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-22.04   # older base for broad glibc compatibility
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 22.04's apt Qt is 6.2, below our 6.5 minimum — use the official
      # Qt build (same as the Windows job); apt provides GStreamer and tools.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # Preinstalled libunwind-14-dev (LLVM) conflicts with libunwind-dev,
          # which libgstreamer1.0-dev depends on — a known ubuntu-22.04 runner quirk.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file fuse libfuse2 \
            libxcb-cursor0 libxkbcommon-x11-0 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-nice gstreamer1.0-libav gstreamer1.0-x
      - name: Build AppImage
        run: |
          export CMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          bash client/packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: signal-linux-appimage
          path: signal-x86_64.AppImage

  # ---------------------------------------------------------------- release
  release:
    needs: [plan, signaling, windows-installer, macos-dmg, linux-appimage]
    runs-on: ubuntu-latest
    # Only tag pushes publish, and only when every build succeeded. On a tag
    # plan resolves target=all, so none of the needs are skipped; the
    # !failure/!cancelled guard just keeps a broken build from publishing a
    # half-empty release.
    if: needs.plan.outputs.publish == 'true' && !failure() && !cancelled()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/signaling-linux-amd64/signaling-linux-amd64
            artifacts/signaling-linux-arm64/signaling-linux-arm64
            artifacts/signal-setup/signal-setup.exe
            artifacts/signal-macos-x86_64/signal-macos-x86_64.dmg
            artifacts/signal-macos-arm64/signal-macos-arm64.dmg
            artifacts/signal-linux-appimage/signal-x86_64.AppImage
